<div class="film-details" *ngIf="film as f; else notFound">
  <div class="film-details__header">
    <img
      class="film-details__poster"
      [src]="f.poster_url || 'assets/placeholder-img.png'"
      [alt]="f.title || 'Poster'"
    />
  </div>

  <div class="film__info__main">
    <ul class="film-details__container">
      <li class="title_container">
        <span class="title__label">
          {{ f.title }} ({{ f.release | date : "yyyy" }})
        </span>

        <app-btn-watchlist [film]="f"></app-btn-watchlist>

        <app-btn-edit
          *ngIf="isInWatchlist$(f.id) | async"
          [film]="f"
        ></app-btn-edit>

        <app-btn-watched [film]="f"></app-btn-watched>
      </li>

      <li class="film-info__container">
        <span *ngIf="f.runtime && f.runtime > 0" class="film-details__label">
          {{ f.runtime }} minutes
        </span>
        <span class="film-details__label color__purple">
          {{ f.genre?.join(", ") || "—" }}
        </span>
      </li>
    </ul>

    <li class="outside__box">
      <span class="synopsis__text">{{ f.synopsis ?? "—" }}</span>
    </li>
  </div>
</div>

<ng-template #notFound>
  <p>Film not found.</p>
</ng-template>
