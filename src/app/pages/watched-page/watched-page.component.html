<div class="watched-page">
  <h2>Watch History</h2>

  <div *ngIf="svc.watched$ | async as list">
    <p *ngIf="!list.length">
      You don't have any films saved to your watch history.
    </p>

    <div class="cards-grid">
      <app-card *ngFor="let film of list; trackBy: trackById" [film]="film">
      </app-card>
    </div>
  </div>
</div>
